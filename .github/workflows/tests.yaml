name: testing

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  testing:
    # Use macOS so tests can exec /usr/bin/osascript if any are added later.
    # Cross-compilation works fine for Go-only checks, but running the real
    # client requires the Things 3 toolchain that only ships on darwin.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run tests
        run: go test -v -race -coverprofile=cover.out ./...
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./cover.out
          fail_ci_if_error: false
